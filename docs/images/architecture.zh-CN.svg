<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="herder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5ce8"/>
      <stop offset="1" stop-color="#9a6cf0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f2a44" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a8"/>
    </marker>
  </defs>

  <rect width="1000" height="470" rx="24" fill="url(#bg)"/>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="36" y="60" width="214" height="360" rx="30" fill="#ffffff" stroke="#dde2ec"/>
  </g>
  <rect x="113" y="72" width="60" height="6" rx="3" fill="#e3e7ef"/>
  <circle cx="62" cy="102" r="7" fill="#3370ff"/>
  <text x="76" y="107" font-size="14" font-weight="600" fill="#1f2a44">飞书</text>
  <line x1="52" y1="120" x2="234" y2="120" stroke="#eef1f6"/>

  <rect x="88" y="134" width="148" height="46" rx="14" fill="#3370ff"/>
  <text x="100" y="153" font-size="12" fill="#ffffff">工作日每天 9 点</text>
  <text x="100" y="170" font-size="12" fill="#ffffff">看看有没有新 issue</text>

  <rect x="52" y="192" width="152" height="46" rx="14" fill="#f0f2f7"/>
  <text x="64" y="211" font-size="12" fill="#1f2a44">好，工作日每天 9 点</text>
  <text x="64" y="228" font-size="12" fill="#1f2a44">我去看一眼。</text>

  <rect x="52" y="252" width="182" height="146" rx="14" fill="#ffffff" stroke="#dde2ec"/>
  <rect x="52" y="252" width="182" height="30" rx="14" fill="#e9fbf1"/>
  <rect x="52" y="268" width="182" height="14" fill="#e9fbf1"/>
  <circle cx="68" cy="267" r="5" fill="#22a06b"/>
  <text x="80" y="271" font-size="12" font-weight="600" fill="#1d7a52">任务完成</text>
  <text x="64" y="302" font-size="12" fill="#1f2a44">登录的 bug 修好了，</text>
  <text x="64" y="319" font-size="12" fill="#1f2a44">PR #12 已开，测试都过了。</text>
  <text x="64" y="336" font-size="12" fill="#1f2a44">要我合并吗？</text>
  <rect x="64" y="352" width="158" height="32" rx="9" fill="#f5f7fb" stroke="#dde2ec"/>
  <text x="143" y="372" font-size="12" fill="#5b6478" text-anchor="middle">Pi 的原话 ▾</text>

  <!-- Phone <-> Herder -->
  <line x1="262" y1="225" x2="318" y2="225" stroke="#8a94a8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="212" font-size="11" fill="#8a94a8" text-anchor="middle">聊天</text>

  <!-- Herder -->
  <g filter="url(#shadow)">
    <rect x="326" y="128" width="190" height="196" rx="22" fill="url(#herder)"/>
  </g>
  <text x="421" y="170" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">主管</text>
  <text x="421" y="191" font-size="12" fill="#e6e0ff" text-anchor="middle">轻量模型 · 三种说话风格</text>
  <g font-size="12.5" fill="#ffffff">
    <text x="348" y="226">• 启动并跟进任务</text>
    <text x="348" y="250">• 用自己的话告诉你结果</text>
    <text x="348" y="274">• 定时任务和各种盯梢</text>
    <text x="348" y="298">• 出了问题才记经验</text>
  </g>

  <!-- Herder -> Mac -->
  <line x1="528" y1="225" x2="566" y2="225" stroke="#8a94a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="547" y="212" font-size="11" fill="#8a94a8" text-anchor="middle">工具</text>

  <!-- Mac -->
  <g filter="url(#shadow)">
    <rect x="574" y="36" width="396" height="400" rx="22" fill="#ffffff" stroke="#dde2ec"/>
  </g>
  <circle cx="598" cy="60" r="5" fill="#ff5f57"/>
  <circle cx="614" cy="60" r="5" fill="#febc2e"/>
  <circle cx="630" cy="60" r="5" fill="#28c840"/>
  <text x="772" y="65" font-size="13" font-weight="600" fill="#1f2a44" text-anchor="middle">你 Mac 上的 AgentHerd</text>

  <!-- Core -->
  <rect x="596" y="86" width="352" height="112" rx="16" fill="#f5f7fb" stroke="#e3e7ef"/>
  <text x="614" y="110" font-size="13" font-weight="600" fill="#1f2a44">核心</text>
  <g font-size="11.5" fill="#3b4559">
    <rect x="612" y="122" width="158" height="28" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="691" y="140" text-anchor="middle">检查每一次工具调用</text>
    <rect x="778" y="122" width="154" height="28" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="855" y="140" text-anchor="middle">看门狗盯卡住的任务</text>
    <rect x="612" y="158" width="320" height="28" rx="14" fill="#ffffff" stroke="#dde2ec"/>
    <text x="772" y="176" text-anchor="middle">herd.db · 任务、记忆、主管的对话</text>
  </g>

  <!-- Core -> agents -->
  <line x1="772" y1="200" x2="772" y2="230" stroke="#8a94a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="782" y="221" font-size="11" fill="#8a94a8">ACP</text>

  <!-- Agents -->
  <g font-size="13" font-weight="600" fill="#1f2a44" text-anchor="middle">
    <rect x="596" y="238" width="110" height="66" rx="14" fill="#eef3ff" stroke="#c9d8ff"/>
    <text x="651" y="268">Pi</text>
    <rect x="717" y="238" width="110" height="66" rx="14" fill="#eef3ff" stroke="#c9d8ff"/>
    <text x="772" y="268">Codex</text>
    <rect x="838" y="238" width="110" height="66" rx="14" fill="#eef3ff" stroke="#c9d8ff"/>
    <text x="893" y="262">DeepSeek</text>
    <text x="893" y="278">Harness</text>
  </g>
  <g font-size="10.5" fill="#5b6478" text-anchor="middle">
    <text x="651" y="290">你的模型</text>
    <text x="772" y="290">GPT 模型</text>
    <text x="893" y="294">点名时使用</text>
  </g>
  <text x="772" y="326" font-size="11" fill="#8a94a8" text-anchor="middle">每个任务在项目的隐藏副本里干活</text>

  <!-- Watchers -->
  <line x1="596" y1="344" x2="948" y2="344" stroke="#eef1f6"/>
  <g font-size="12" fill="#3b4559" text-anchor="middle">
    <rect x="596" y="360" width="110" height="52" rx="14" fill="#fff7ec" stroke="#f6dcb5"/>
    <text x="651" y="382">GitHub</text>
    <text x="651" y="399" font-size="10.5" fill="#8a6a3d">PR · issue</text>
    <rect x="717" y="360" width="110" height="52" rx="14" fill="#fff7ec" stroke="#f6dcb5"/>
    <text x="772" y="382">邮件</text>
    <text x="772" y="399" font-size="10.5" fill="#8a6a3d">你要求时才看</text>
    <rect x="838" y="360" width="110" height="52" rx="14" fill="#fff7ec" stroke="#f6dcb5"/>
    <text x="893" y="382">定时任务</text>
    <text x="893" y="399" font-size="10.5" fill="#8a6a3d">一句话就建好</text>
  </g>

  <text x="500" y="455" font-size="11" fill="#a0a8b8" text-anchor="middle">除了聊天消息和模型调用，什么都不离开你的 Mac。Key 只存在 ~/.agentherd。</text>
</svg>
